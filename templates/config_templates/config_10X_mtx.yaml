# ── Data format ──
data_format: 10X_mtx

# ── Data input ──
data_input:
  mtx_prefix: "{{MTX_PREFIX}}"
  # mtx_dir: ""

# ── Dataset metadata ──
tissue: "{{TISSUE}}"
# tissue_maturity: "unknown"   # "developing" | "adult" | "unknown"
species: "{{SPECIES}}"
expression_type: "{{EXPRESSION_TYPE}}"
# raw_counts | log1p_counts | TPM | CPM | FPKM
# TPM/FPKM/CPM: total_counts & complexity filters are auto-skipped.
# Scrublet is auto-disabled for non-raw_counts data.
# Adjust min_genes / max_pct_mito accordingly.

# ── Sample metadata ──
sample_meta:
  # Map 10X barcode suffixes (-1, -2, ...) to sample names.
  # sample_map:
  #   1: sample1
  #   2: sample2
  sample_map: {}

  # Stage mapping (if developmental data)
  # stage_map:
  #   1: Day3
  #   2: Day7
  stage_map: {}
  stage_order: []

# ── QC ──
qc:
  min_genes: 500
  max_genes: 7500
  max_pct_mito: 20.0
  min_cells_per_gene: 3
  min_genes_per_umi: 0.7
  # use_adaptive_thresholds: true
  # mad_n_mads: 3.0

  # ── Single-nucleus (snRNA-seq) ──
  # is_nuclei: true
  # max_pct_mito_nuclei: 5.0

# ── Scrublet (doublet detection) ──
scrublet:
  run: true   # auto-disabled when expression_type != raw_counts

# ── HVG ──
hvg:
  n_top_genes: 4000
  batch_key: sample
  flavor: seurat_v3
  # use_regress_out: false

# ── Batch correction / Harmony ──
harmony:
  use_harmony: true
  batch_key: sample
  max_iter: 20

# ── PCA ──
pca:
  n_pcs_full: 100
  n_pcs_use: 50

# ── Clustering ──
clustering:
  leiden_resolutions: [0.3, 0.5, 0.8, 1.0, 1.5, 2.0]
  best_resolution: 1.0
  best_n_neighbors: 0
  cluster_selection_method: "multi_metric"
  umap_selection_method: "convex_hull"
  param_grid_min_dist: [0.1, 0.3, 0.5]
  param_grid_spread: [1.0]
  umap_min_dist: 0.3
  umap_spread: 1.0

# ── Cell type markers ──
# TODO: Add known marker genes for {{TISSUE}} tissue.
marker:
  marker_dict: {}
  subcluster_types: []
  subcluster_resolution: 0.4
  min_cells_subcluster: 50

# ── Knowledge base ──
# TODO: Set to a tissue KB name if one exists in rna/tissue_ontologies/.
# tissue_kb: ""   # e.g. "retina", "hypothalamus"

# ── Trajectory ──
trajectory:
  root_cell_types: []
  # root_markers: [SOX2, PAX6, NES]
  # n_diffmap_comps: 15
  # n_branchings: 2

# ── Differential expression ──
de:
  method: wilcoxon
  n_genes: 50
  pval_cutoff: 0.05
  logfc_cutoff: 0.25
  stage_pairwise: true
  # auto_switch_on_low_quality: true

# ── Enrichment (uncomment to enable) ──
# enrichment:
#   run: true
#   method: both          # ora | prerank | both
#   gene_sets: [GO_Biological_Process_2023, KEGG_2021_Human]
#   organism: human

# ── GRN regulatory network analysis ──
grn:
  run: true
  method: decoupler
  species: human
  n_top_regulons: 50
  min_regulon_size: 5
  # confidence_levels: [A, B, C]
  # tissue_mode: off
  # use_kb_relevance: false
  # export_filtered: false

# ── CCI cell-cell interaction analysis ──
cci:
  run: true
  # method: liana
  # lr_database: consensus
  # permutations: 1000
  # n_top_interactions: 50
  # spatial_method: liana_spatial
  # spatial_distance: 0.0
  # lr_cache_dir: ""

# ── AI settings (uncomment to enable) ──
# ai:
#   enabled: true
#   api_base: https://api.deepseek.com/v1
#   model: deepseek-v4-pro
#   max_tokens: 32768
#   temperature: 0.1
#   thinking_enabled: true
#   reasoning_effort: high
#   annotation: true
#   subcluster: true
#   interpretation: true
#   cache_responses: true

# ── Execution ──
execution:
  n_jobs: 0
  random_seed: 42
  # force_csr: true
  # use_float32: true
  # limit_blas_threads: true
  # scanpy_verbosity: 2

# h5ad_compression: gzip

# ── Downsampling (optional) ──
# downsample:
#   target: 5000
#   strategy: random
