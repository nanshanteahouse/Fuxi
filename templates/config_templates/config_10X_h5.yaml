# ── Data format ──
data_format: 10X_h5

# 公共默认参数已移至 global.yaml (参考 global.example.yaml)
# 本模板仅包含数据集特异性和生物学相关参数

# ── Data input ──
data_input:
  # .h5 file matching pattern (glob syntax)
  # Default matches Cell Ranger filtered output: "*filtered_feature_bc_matrix.h5"
  # For raw matrix: "*raw_feature_bc_matrix.h5"
  # Custom: "*_counts.h5" etc.
  h5_file_pattern: "*filtered_feature_bc_matrix.h5"
  # h5_dir: "data"

# ── Sample metadata ──
sample_meta:
  # When multiple .h5 files exist, sample names are auto-extracted from filenames.
  # For 10X multi-channel aggregation, barcodes use -1, -2, ... suffixes.
  # sample_map:
  #   1: sample1
  #   2: sample2
  sample_map: {}

  # barcode suffix -> developmental stage / experimental group
  # stage_map:
  #   1: Day3
  #   2: Day7
  stage_map: {}
  stage_order: []

# ── Dataset metadata ──
tissue: "unknown"
# tissue_kb: ""          # auto-inferred from 'tissue' when matching KB exists
# tissue_maturity: "unknown"   # "developing" | "adult" | "unknown"
species: "human"
expression_type: raw_counts
# raw_counts | log1p_counts | TPM | CPM | FPKM
# TPM/FPKM/CPM: total_counts & complexity filters are auto-skipped.
# Scrublet is auto-disabled for non-raw_counts data.

# ── QC ──
qc:
  min_genes: 200
  max_genes: 7500
  # max_pct_mito: 20.0  # global default; snRNA-seq→5-10%, heart/liver→15%
  min_genes_per_umi: 0.7

  # ── Adaptive thresholds (managed by global.yaml) ──
  # use_adaptive_thresholds: true   # ← global.yaml default
  # mad_n_mads: 3.0                  # MAD multiplier (developing tissue auto-uses 5.0)
  # ncount_max_mad: 5.0              # nCount upper bound MAD multiplier

  # ── Single-nucleus (snRNA-seq) ──
  # is_nuclei: true
  # max_pct_mito_nuclei: 5.0

# ── Scrublet (doublet detection) ──
scrublet:
  # serial_threshold: 15000             # cells: >threshold → serial, ≤threshold → parallel
  run: true   # auto-disabled when expression_type != raw_counts

# ── HVG ──
hvg:
  n_top_genes: 4000
  batch_key: sample
  flavor: seurat_v3
  # use_regress_out: false

# ── Batch correction / Integration ──
integration:
  method: harmony
  batch_key: sample

  # ── Neighbor persistence (skip re-computation) ──
  # persist_neighbors: false               # reuse neighbors from clustering step
  # persisted_neighbors_k: 50              # k for persisted neighbor graph
  # -- v4.x+: batch diagnosis (auto-classify batch vs biology columns) --

  # -- scVI (deep generative model, method: scvi) --
  scvi:
    n_latent: 30
    n_layers: 2
    n_hidden: 128
    max_epochs: 400
    batch_key: sample
    use_gpu: true
    train_size: 0.9
    batch_size: 128
    early_stopping: false
    precision: "32"              # "16-mixed" / "bf16-mixed" for GPU speedup
    # Advanced params: see global.example.yaml → integration.scvi

# ── PCA ──
pca:
  n_pcs_full: 100
  n_pcs_use: 50

# ── Clustering ──
clustering:
  leiden_resolutions: [0.3, 0.5, 0.8, 1.0, 1.5, 2.0]
  best_resolution: 1.0
  best_n_neighbors: 0
  umap_color_by_batch: false
  # batch_key_override: null  # optionally override integration.batch_key

  # ── Multi-metric evaluation ──
  # stability_n_seeds: 12                  # random seeds for stability scoring
  # stability_leiden_n_iterations: 1000    # Leiden iterations for stability
  # umap_selection_metric: trustworthiness # UMAP quality metric (trustworthiness /
  # umap_maxiter: null                    # max UMAP iterations (null=auto). 200-500 for 1M+ cells.
  # umap_n_epochs: null                   # UMAP training epochs (null=auto)
                                           #   continuity / distance_mse / sil_score)
  # param_grid_n_neighbors_adaptive: true  # auto-scale neighbors from n_obs
  # plot_per_combo: false                 # per-(n_neighbors, resolution) UMAP plots

  # ── Funnel mode (large datasets) ──
  # funnel_enabled: true                   # progressive grid search for >100k cells
  # funnel_threshold: 100000               # min n_obs to trigger funnel
  # funnel_subsample_size: 50000           # subsample for funnel grid
  # funnel_top_k: 3                        # top candidates re-validated on full data

  # ── Target cluster mode ──
  # target_n_clusters: null                # target cluster count (binary-search
                                           #   resolution instead of grid)
  # target_search_max_iters: 10            # max binary-search iterations

# ── Cell type markers ──
# Format: CellType: [marker1, marker2, ...]
# Replace with actual markers for your tissue type.
marker:
  marker_dict: {}
  subcluster_types: []
  # candidate_pool_expand_steps: [50, 100, 200]   # adaptive scoring tiers → n_genes
  subcluster_resolution: 0.4
  min_cells_subcluster: 50

# ── Knowledge base ──
# tissue_kb: ""   # Tissue KB name from core/kb/, e.g. "retina"

# ── Trajectory ──
trajectory:
  root_cell_types: []
  # root_markers: [SOX2, PAX6, NES]
  # n_diffmap_comps: 15
  # n_branchings: 2

# ── Differential expression ──
de:
  stage_pairwise: true
  # auto_switch_on_low_quality: true

# ── Pseudobulk DE (PyDESeq2) ──
# de.pseudobulk:
#   sample_col: sample
#   design: "~condition"
#   contrast_column: condition
#   contrast_treatment: treated
#   contrast_baseline: control
#   alpha: 0.05
# ── Enrichment (uncomment to enable) ──
# enrichment:
#   run: true
#   method: both          # ora | prerank | both
#   gene_sets: [GO_Biological_Process_2023, KEGG_2021_Human]
#   organism: human

# Tissue-specific gene set libraries (v4.0+):
# Available: CellMarker_Augmented_2021, PanglaoDB_Augmented_2021,
#            Tabula_Sapiens, Azimuth_Cell_Types, Allen_Brain_Atlas
#   gene_sets_tissue:
#     - CellMarker_Augmented_2021
#     - PanglaoDB_Augmented_2021

# Tissue-aware ranking/filtering (v4.0+):
#   'off'  = pure statistical ranking (default, current behavior)
#   'soft' = annotate tissue_relevant column + output _tissue_relevant.csv
#   'hard' = keep only tissue-relevant pathways
#   tissue_mode: soft
#   use_kb_relevance: true
#   redundancy_cluster: true

# ── GRN regulatory network analysis ──
grn:
  run: true
  method: decoupler
  species: human
  n_top_regulons: 50
  min_regulon_size: 5
  # confidence_levels: [A, B, C]

# ── CCI cell-cell interaction analysis ──
cci:
  run: true
  # method: liana
  # lr_database: consensus
  # permutations: 1000
  # n_top_interactions: 50
  # spatial_method: liana_spatial
  # spatial_distance: 0.0
  # lr_cache_dir: ""

