# ── Data format ──
data_format: 10X_mtx

# 公共默认参数已移至 global.yaml (参考 global.example.yaml)
# 本模板仅包含数据集特异性和生物学相关参数

# ── Data input ──
data_input:
  mtx_prefix: "<GSE_ID>_"

# ── Sample metadata (19 samples, GW7~GW20) ──
sample_meta:
  sample_map:
    1: GW7-lane1
    2: GW7-lane2
    3: GW8-1
    4: GW8-2
    5: GW10
    6: GW12_01
    7: GW12_02
    8: GW15-A
    9: GW15-M
    10: GW15-P
    11: GW18-01-A
    12: GW18-01-M
    13: GW18-01-P
    14: GW18-02-lane1
    15: GW18-02-lane2
    16: GW18-02-lane3
    17: GW20-A
    18: GW20-M
    19: GW20-P

  stage_map:
    1: GW7
    2: GW7
    3: GW8
    4: GW8
    5: GW10
    6: GW12
    7: GW12
    8: GW15
    9: GW15
    10: GW15
    11: GW18
    12: GW18
    13: GW18
    14: GW18
    15: GW18
    16: GW18
    17: GW20
    18: GW20
    19: GW20
  stage_order: [GW7, GW8, GW10, GW12, GW15, GW18, GW20]

# ── Dataset metadata ──
# GW7-GW20 = developing fetal hypothalamus
tissue_maturity: "developing"   # enables wider MAD bounds (5× instead of 3×)

# ── QC ──
qc:
  min_genes: 200
  max_genes: 7000
  # max_pct_mito: 20.0  # global default; snRNA-seq→5-10%, heart/liver→15%
  min_genes_per_umi: 0.7

  # ── Adaptive thresholds (managed by global.yaml) ──
  # use_adaptive_thresholds: true   # ← global.yaml default
  # mad_n_mads: 3.0                  # auto-promoted to 5.0 when tissue_maturity=developing
  # ncount_max_mad: 5.0              # nCount upper bound MAD multiplier

  # ── Single-nucleus (snRNA-seq) ──
  # is_nuclei: true
  # max_pct_mito_nuclei: 5.0

# ── Scrublet (doublet detection) ──
scrublet:
  run: true

# ── HVG ──
hvg:
  n_top_genes: 4000
  batch_key: sample
  flavor: seurat_v3
  # use_regress_out: false

# ── Batch correction / Integration ──
integration:
  method: harmony
  batch_key: sample

  # -- v4.x+: batch diagnosis (auto-classify batch vs biology columns) --

  # -- scVI (deep generative model, method: scvi) --
  scvi:
    n_latent: 30
    n_layers: 2
    n_hidden: 128
    max_epochs: 400
    batch_key: sample
    use_gpu: true
    train_size: 0.9
    batch_size: 128
    early_stopping: false
    precision: "32"              # "16-mixed" / "bf16-mixed" for GPU speedup
    # Advanced params: see global.example.yaml → integration.scvi

# ── PCA ──
pca:
  n_pcs_full: 100
  n_pcs_use: 50

# ── Clustering ──
clustering:
  leiden_resolutions: [0.3, 0.5, 0.8]
  best_resolution: 0.8
  best_n_neighbors: 0
  umap_color_by_batch: false
  # batch_key_override: null  # optionally override integration.batch_key

# ── Known hypothalamus cell type markers ──
marker:
  marker_dict:
    NE: [HES1, HES5, SOX2, NES, NOTCH1]
    NP: [SOX2, PAX6, ASCL1, MKI67, TOP2A]
    Neuron: [RBFOX3, MAP2, SYN1, DCX, STMN2, TUBB3]
    Astrocyte: [GFAP, AQP4, S100B, ALDH1L1, GJA1]
    OPC: [PDGFRA, CSPG4, SOX10, OLIG1, OLIG2]
    OL: [MBP, MOG, PLP1, MAG, CLDN11]
    Ependymocyte: [FOXJ1, RSPH1, DNAH9, CFAP53, TUBB4B]
    Microglia: [PTPRC, CSF1R, CX3CR1, TREM2, ITGAM]
    Endothelial: [PECAM1, VWF, CDH5, CLDN5, FLT1]
    Mural: [RGS5, PDGFRB, ACTA2, MYH11, CSPG4]
    VLMC: [LUM, DCN, COL1A1, COL3A1, FN1]
  subcluster_types: [NE, NP, Neuron]
  subcluster_resolution: 0.4
  min_cells_subcluster: 50

# ── Knowledge base ──
# tissue_kb: ""

# ── Differential expression ──
de:
  stage_pairwise: true
  # auto_switch_on_low_quality: true

# ── Pseudobulk DE (PyDESeq2) ──
# de.pseudobulk:
#   sample_col: sample
#   design: "~condition"
#   contrast_column: condition
#   contrast_treatment: treated
#   contrast_baseline: control
#   alpha: 0.05
# ── Trajectory ──
trajectory:
  root_cell_types: [NE, NP]
  # root_markers: [SOX2, PAX6, NES]
  # n_diffmap_comps: 15
  # n_branchings: 2

# ── Enrichment (uncomment to enable) ──
# enrichment:
#   run: true
#   method: both
#   gene_sets: [GO_Biological_Process_2023, KEGG_2021_Human]
#   organism: human

# ── GRN regulatory network analysis ──
grn:
  run: true
  method: decoupler
  species: human
  n_top_regulons: 50
  min_regulon_size: 5
  # confidence_levels: [A, B, C]

# ── CCI cell-cell interaction analysis ──
cci:
  run: true
  # method: liana
  # lr_database: consensus
  # permutations: 1000
  # n_top_interactions: 50
  # spatial_method: liana_spatial
  # spatial_distance: 0.0
  # lr_cache_dir: ""

