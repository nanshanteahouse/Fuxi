# ── Modality & data format ──
modality: atac
data_format: 10x_fragments

# 公共默认参数已移至 global.yaml (参考 global.example.yaml)
# 本模板仅包含数据集特异性和生物学相关参数

# ── Data input ──
data_input:
  fragment_file: "{{FRAGMENT_FILE}}"
  barcodes_file: "{{BARCODES_FILE}}"

# ── ATAC-specific config ──
atac:
  # Reference genome
  genome: "{{GENOME}}"
  # chrom_sizes: ""
  # blacklist_bed: ""
  # tss_bed: ""

  # QC
  min_fragments: 1000
  max_fragments: 50000
  min_tsse: 7.0

  # Harmony batch correction
  harmony_use_harmony: false
  harmony_batch_key: sample

  # Multi-metric clustering (stability + gain)
  multi_metric_enabled: false
  # max_blacklist_ratio: 0.05
  # min_peak_region_fragments: 300

  # Peak calling
  peak_qval: 0.05
  peak_width: 500
  # use_macs3: true

  # Feature selection / dimensionality reduction
  n_features: 50000
  n_spectral: 30

  # Differential accessibility
  marker_peaks_log2fc: 0.5
  marker_peaks_fdr: 0.05

  # Motif analysis
  motif_db: JASPAR2024

# ── Dataset metadata ──
tissue: "{{TISSUE}}"
# tissue_maturity: "unknown"   # "developing" | "adult" | "unknown"
species: "{{SPECIES}}"

# ── Clustering ──
clustering:
  n_neighbors: 15
  param_grid_n_neighbors: [15, 20, 30]
  param_grid_resolutions: [0.3, 0.5, 0.8, 1.0, 1.5, 2.0]
  umap_color_by_batch: false
  # batch_key_override: null  # optionally override integration.batch_key

# ── Trajectory ──
trajectory:
  root_cell_types: []
  # terminal_cell_types: []

# ── Peak-to-gene enrichment ──
enrichment:
  peak_gene_distance: 100000
  # gene_annotation_bed: ""
  gene_sets: [GO_Biological_Process_2023, KEGG_2021_Human]
  organism: human
  # method: both
  # n_top_genes: 2000
  # pval_cutoff: 0.05
  # min_size: 15
  # max_size: 500
  # permutations: 1000

# ── RNA integration (multiome / paired RNA+ATAC) ──
# rna_h5ad: ""
# rna_marker_top_n: 200
# rna_marker_pval_threshold: 0.05
# rna_marker_logfc_min: 0.25

# ── AI settings (uncomment to enable) ──
# ai:
#   enabled: true
