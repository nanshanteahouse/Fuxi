# ── Data format (CSV matrix) ──
data_format: csv_matrix

# 公共默认参数已移至 global.yaml (参考 global.example.yaml)
# 本模板仅包含数据集特异性和生物学相关参数

# ── Data input ──
data_input:
  matrix_file: "<GSE_ID>_matrix.mtx.gz"
  barcodes_file: "<GSE_ID>_barcodes.csv.gz"
  features_file: "<GSE_ID>_genes.csv.gz"

  # CSV metadata column mapping
  meta_columns:
    sample: sample
    stage: age
    tissue: sample_type

# ── Sample metadata ──
sample_meta:
  # Stage mapping is done manually in step 04 using pandas map.
  # See rna/steps/04_cluster_umap.py _map_stages().
  stage_map: {}
  stage_order: [Organoid, EarlyFetal, MidFetal, LateFetal, Postnatal, Adult]

# ── QC ──
qc:
  min_genes: 200
  max_genes: 7500
  # max_pct_mito: 20.0  # global default; snRNA-seq→5-10%, heart/liver→15%
  min_genes_per_umi: 0.7

  # ── Adaptive thresholds (managed by global.yaml) ──
  # use_adaptive_thresholds: true   # ← global.yaml default
  # mad_n_mads: 3.0                  # MAD multiplier (developing tissue auto-uses 5.0)
  # ncount_max_mad: 5.0              # nCount upper bound MAD multiplier

  # ── Single-nucleus (snRNA-seq) ──
  # is_nuclei: true
  # max_pct_mito_nuclei: 5.0

# ── Scrublet (doublet detection) ──
scrublet:
  # serial_threshold: 15000             # cells: >threshold → serial, ≤threshold → parallel
  run: true

# ── HVG ──
hvg:
  n_top_genes: 5000
  batch_key: sample
  flavor: seurat_v3
  # use_regress_out: false

# ── Batch correction / Integration ──
integration:
  method: harmony
  batch_key: age

  # -- v4.x+: batch diagnosis (auto-classify batch vs biology columns) --
  # diagnose: true                        # 全量诊断（大细胞数深拷贝，百万级建议 false）
  # diagnose_max_cells: 50000            # 诊断子采样上限（默认 5 万，秒级）
  # stream_raw: true                     # 流式写 .raw（>100 万细胞建议 true，峰值内存 -24%）

  # -- scVI (deep generative model, method: scvi) --
  scvi:
    n_latent: 30
    n_layers: 2
    n_hidden: 128
    max_epochs: 400
    batch_key: sample
    use_gpu: true
    train_size: 0.9
    batch_size: 1024           # 128→1024: scverse 官方线性加速建议，实测 0.51→0.32 s/epoch
    early_stopping: true       # ELBO 早停（Lightning patience=3 默认），避免傻跑满 max_epochs
    precision: "16-mixed"       # 3090 AMP 加速（实测 ~1.5-2x）；CPU 自动降级 "32"
    # ── WSL2 关键（实测 GPU 饿死根因修复，勿改）──
    datasplitter_kwargs:
      num_workers: 0            # WSL2 IPC 阻塞 → GPU 0% 利用率；0 = 主进程加载
    trainer_kwargs:
      enable_progress_bar: false  # 去 tqdm 每 batch 管道写（加剧 pipe_write 阻塞）
    # Advanced params: see global.example.yaml → integration.scvi

# ── PCA ──
# n_pcs_full = PCA 计算量；n_pcs_use = 下游消费维数（04+ 用 min() 兑底）
# method: scvi 时 n_pcs_use 建议 = 30（scVI latent 维，与 scvi.n_latent 一致）
pca:
  n_pcs_full: 100
  n_pcs_use: 50

# ── Clustering ──
clustering:
  leiden_resolutions: [0.3, 0.5, 0.8, 1.0, 1.5, 2.0]
  best_resolution: 1.0
  best_n_neighbors: 0
  umap_color_by_batch: false
  # batch_key_override: null  # optionally override integration.batch_key
  # Stratified scatter caps (step 04 figures): label sizes <= cap_small kept
  # in full (rare populations stay visible); 500-50k capped at cap_medium;
  # > umap_plot_stratum_large capped at cap_large. Hard ceiling:
  # umap_plot_max_cells.
  # umap_plot_cap_small: 500
  # umap_plot_cap_medium: 500
  # umap_plot_cap_large: 1000
  # umap_plot_stratum_large: 50000

# ── Known retina cell type markers ──
  # umap_maxiter: null                    # max UMAP iterations (null=auto). 200-500 for 1M+ cells.
  # umap_n_epochs: null                   # UMAP training epochs (null=auto)
marker:
  marker_dict:
    RPCs: [VSX2, PAX6, SOX2, HES1, NOTCH1]
    Neurogenic Cells: [ASCL1, NEUROG2, TUBB3, DCX, STMN2]
    RGCs: [POU4F2, POU4F1, NEFM, NEFL, ELAVL4]
    Cones: [ARR3, OPN1SW, GNAT2, PDE6C, RCVRN]
    Rods: [NRL, RHO, GNAT1, PDE6B, SAG]
    Horizontal: [ONECUT1, ONECUT2, PROX1, CALB1, LHX1]
    Bipolar: [VSX1, PRKCA, TRPM1, GRM6, CABP5]
    Amacrine: [GAD1, GAD2, SLC6A9, TFAP2A, TFAP2B]
    Muller Glia: [RLBP1, GFAP, VIM, SLC1A3, GLUL]
    BC/Photo_Precurs: [CRX, OTX2, VSX1]
    AC/HC_Precurs: [PTF1A, TFAP2A, PROX1, ONECUT1]
    Microglia: [AIF1, P2RY12, CSF1R, CX3CR1, CD74]
    Astrocytes: [GFAP, AQP4, ALDH1L1, S100B, SOX9]
    Pericytes: [PDGFRB, CSPG4, RGS5, ANPEP, ACTA2]
    RPE: [RPE65, BEST1, LRAT, TIMP3, RDH10]
    Endothelial: [PECAM1, VWF, CDH5, CLDN5, EGFL7]
    Oligodendrocytes: [MBP, PLP1, MOG, OLIG2, SOX10]
    Fibroblast: [COL1A1, DCN, LUM, COL3A1, COL1A2]
  # subcluster_types: [RPCs, Muller Glia]
  # subcluster_resolution: 0.4
  # min_cells_subcluster: 50

# ── Knowledge base ──
# tissue_kb: ""
# developmental_mode: true  # enable for developing/fetal retina (relaxes validation, enables NRPC rules)

# ── Differential expression ──
  # candidate_pool_expand_steps: [50, 100, 200]   # adaptive scoring tiers → n_genes for DE
de:
  stage_pairwise: true
  # auto_switch_on_low_quality: true

# ── Pseudobulk DE (PyDESeq2) ──
# de.pseudobulk:
#   sample_col: sample
#   design: "~condition"
#   contrast_column: condition
#   contrast_treatment: treated
#   contrast_baseline: control
#   alpha: 0.05
# ── Trajectory ──
trajectory:
  root_markers: [VSX2, PAX6, SOX2, HES1, NOTCH1]
  # root_cell_types: []
  # n_diffmap_comps: 15
  # n_branchings: 2

# ── Enrichment (uncomment to enable) ──
# enrichment:
#   run: true
#   method: both
#   gene_sets: [GO_Biological_Process_2023, KEGG_2021_Human]
#   organism: human

# ── GRN regulatory network analysis ──
grn:
  run: true
  method: decoupler
  species: human
  n_top_regulons: 50
  min_regulon_size: 5
  # confidence_levels: [A, B, C]
  tissue_mode: soft
  use_kb_relevance: true
  # export_filtered: false

# ── CCI cell-cell interaction analysis ──
cci:
  run: true
  # method: liana
  # lr_database: consensus
  # permutations: 1000
  # n_top_interactions: 50
  # spatial_method: liana_spatial
  # spatial_distance: 0.0
  # lr_cache_dir: ""

