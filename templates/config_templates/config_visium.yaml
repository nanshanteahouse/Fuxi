# ── Modality & data format ──
modality: spatial
data_format: visium

# 公共默认参数已移至 global.yaml (参考 global.example.yaml)
# 本模板仅包含数据集特异性和生物学相关参数

# ── Spatial platform ──
spatial:
  platform: visium
  library_id: "{{LIBRARY_ID}}"
  img_path: ""
  crop_image: true
  img_rescale: 1.0

  # Spatial graph
  neighbors_n: 6
  neighbors_radius: 0.0

  # Spatially variable genes
  run_autocorr: true
  svg_n_top: 2000
  moran_percentile: 90
  # run_segmentation: false

# ── Dataset metadata ──
tissue: "{{TISSUE}}"
# tissue_kb: ""  # auto-inferred from 'tissue' when matching KB exists
# tissue_maturity: "unknown"   # "developing" | "adult" | "unknown"
species: "{{SPECIES}}"

# ── QC ──
qc:
  min_genes: 500
  max_genes: 7500
  # max_pct_mito: 20.0  # global default; snRNA-seq→5-10%, heart/liver→15%
  min_genes_per_umi: 0.7
  # ── Adaptive thresholds (managed by global.yaml) ──
  # use_adaptive_thresholds: true   # ← global.yaml default
  # mad_n_mads: 3.0                  # MAD multiplier
  # ncount_max_mad: 5.0              # nCount upper bound MAD multiplier

# ── HVG ──
hvg:
  n_top_genes: 4000
  flavor: seurat_v3
  # use_regress_out: false
  # forced_genes: []

# ── PCA ──
pca:
  n_pcs_full: 100
  n_pcs_use: 50

# ── Clustering ──
clustering:
  n_neighbors: 30
  leiden_resolutions: [0.3, 0.5, 0.8, 1.0, 1.5, 2.0]
  best_resolution: 1.0
  best_n_neighbors: 0
  leiden_flavor: igraph
  umap_color_by_batch: false
  # batch_key_override: null  # optionally override integration.batch_key
  # umap_paga_init: false

# ── Cell type markers ──
# TODO: Add known marker genes for {{TISSUE}} tissue.
marker:
  marker_dict: {}

# ── Subcluster (fine-resolution annotation) ──
# subcluster:
#   types: []
#   resolution: 0.4
#   min_cells: 50
# ── Differential expression ──
de:
  stage_pairwise: true
  # auto_switch_on_low_quality: true

# ── Pseudobulk DE (PyDESeq2) ──
# de.pseudobulk:
#   sample_col: sample
#   design: "~condition"
#   contrast_column: condition
#   contrast_treatment: treated
#   contrast_baseline: control
#   alpha: 0.05
# ── Trajectory ──
trajectory:
  root_cell_types: []
  # root_markers: [SOX2, PAX6, NES]
  n_diffmap_comps: 15
  n_branchings: 2

# ── Enrichment ──
enrichment:
  run: true
  method: both
  gene_sets:
    - GO_Biological_Process_2023
    - KEGG_2021_Human
  organism: human
  # n_top_genes: 2000
  # pval_cutoff: 0.05
  # min_size: 15
  # max_size: 500
  # permutations: 1000

# ── GRN regulatory network analysis ──
# grn:
#   run: true
#   species: human
#   min_regulon_size: 5
#   n_top_regulons: 50

# ── CCI spatial cell-cell interaction analysis ──
cci:
  run: true
  # method: liana
  # lr_database: consensus
  # permutations: 1000
  # n_top_interactions: 50
  # spatial_method: liana_spatial
  # spatial_distance: 0.0
  # lr_cache_dir: ""

