# ── Data format ──
data_format: count_matrix

# ── Modality ──
modality: bulk
# 公共默认参数已移至 global.yaml (参考 global.example.yaml)
# 本模板仅包含数据集特异性和生物学相关参数

# ── Data input ──
data_input:
  matrix_file: ""
  # metadata_file: "{{METADATA_FILE}}"
  # csv_sep: ","
  # gene_symbol_column: ""

# ── Dataset metadata ──
tissue: "{{TISSUE}}"
species: "{{SPECIES}}"
expression_type: raw_counts
# raw_counts | tpm | fpkm | cpm

# ── Bulk-specific settings ──
bulk:
  design: "~condition"
  # contrast_column: "condition"
  # contrast_treatment: "treated"
  # contrast_baseline: "control"
  alpha: 0.05
  lfc_shrink: true
  normalization_method: deseq2_median_ratios
  # min_counts_per_gene: 10
  # min_samples_per_group: 2
  # n_jobs: 0
  # output_dir: ""
  # batch_correct: false
  # batch_column: "batch"

# ── Enrichment ──
enrichment:
  run: true
  method: both
  gene_sets: [GO_Biological_Process_2023, KEGG_2021_Human]
  organism: human
