expert_rules:
- priority: 1
  condition:
    markers_present:
      RHO: 1.0
      NRL: 1.0
  action: Rod_Photoreceptor
  source: chen2023
  notes: RHO+NRL co-expression defines rod photoreceptors in multi-omics atlas
- priority: 1
  condition:
    markers_present:
      ARR3: 1.0
      GNAT2: 1.0
  action: Cone_Photoreceptor
  source: chen2023
  notes: ARR3+GNAT2 co-expression defines cone photoreceptors in multi-omics atlas
- priority: 1
  condition:
    markers_present:
      RLBP1: 1.0
      GLUL: 1.0
  action: Muller_Glia
  source: chen2023
  notes: RLBP1+GLUL co-expression defines Muller glia in multi-omics atlas
- priority: 1
  condition:
    markers_present:
      POU4F2: 1.0
      NEFM: 1.0
  action: RGC
  source: chen2023
  notes: POU4F2+NEFM co-expression defines RGCs in multi-omics atlas
- priority: 1
  condition:
    markers_present:
      ONECUT1: 1.0
      PROX1: 1.0
  action: Horizontal_Cell
  source: chen2023
  notes: ONECUT1+PROX1 co-expression defines horizontal cells
- priority: 2
  condition:
    markers_present:
      RLBP1: 1.0
      GFAP: 1.0
  action: Muller_Glia
  source: chen2023
  notes: 'RLBP1 is retina MG-specific. GFAP alone drives Astrocyte scoring, but RLBP1+GFAP co-expression in retina indicates reactive Muller glia, not astrocyte. This rule ensures MG wins when both markers are present.'
