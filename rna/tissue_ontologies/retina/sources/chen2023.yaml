    confirm:
    - AIF1    # canonical microglia/myeloid marker (IBA1)
    - C1QA    # complement pathway; Menon2019 score 4.73
    - C1QB    # complement pathway; Menon2019 score 5.80 — strongest MG hit
    - C3      # complement; Hu2019 score 2.68 — most MG-specific in fetal retina
    - CX3CR1  # fractalkine receptor; CNS microglia-specific
    - CSF1R   # M-CSF receptor; required for microglia survival
    add:
    - CD68    # lysosomal macrophage marker
    - FCER1G  # Fc receptor gamma chain; Menon2019 score 3.85
    - PTPRC   # CD45 pan-immune marker
    - TLR4    # innate immune; Hu2019 score 0.69
    - TREM2   # disease-associated microglia (DAM)
    - CD163   # scavenger receptor; perivascular macrophage
    - LAPTM5  # lysosomal immune cell marker
    - HTRA1   # AMD risk gene; MG-enriched in retina
    - P2RY12  # homeostatic microglia marker
    - TMEM119 # homeostatic microglia marker
