novel_types:
- name: Foveal_Cones
  parent: Cone_Photoreceptor
  markers:
  - OPN1LW
  - OPN1SW
  - ARR3
  - GNAT2
  species:
  - Macaca fascicularis
  source: peng2019
- name: Peripheral_Rods
  parent: Rod_Photoreceptor
  markers:
  - RHO
  - NRL
  - NR2E3
  - GNAT1
  species:
  - Macaca fascicularis
  source: peng2019
expert_rules:
- priority: 1
  condition:
    markers_present:
      RHO: 1.0
      NRL: 1.0
  action: Rod_Photoreceptor
  source: peng2019
  notes: RHO+NRL co-expression specifies rod photoreceptor identity
- priority: 1
  condition:
    markers_present:
      ARR3: 1.0
      GNAT2: 1.0
  action: Cone_Photoreceptor
  source: peng2019
  notes: ARR3+GNAT2 co-expression specifies cone photoreceptor identity
- priority: 1
  condition:
    markers_present:
      RLBP1: 1.0
      GLUL: 1.0
  action: Muller_Glia
  source: peng2019
  notes: RLBP1+GLUL co-expression defines Muller glial cells
- priority: 1
  condition:
    markers_present:
      POU4F2: 1.0
      NEFM: 1.0
  action: RGC
  source: peng2019
  notes: POU4F2+NEFM co-expression defines retinal ganglion cells
- priority: 1
  condition:
    markers_present:
      AIF1: 1.0
      P2RY12: 1.0
  action: Microglia
  source: peng2019
  notes: AIF1+P2RY12 co-expression defines retinal microglia
- priority: 1
  condition:
    markers_present:
      ONECUT1: 1.0
      PROX1: 1.0
  action: Horizontal_Cell
  source: peng2019
  notes: ONECUT1+PROX1 co-expression defines horizontal cells
- priority: 2
  condition:
    markers_present:
      GAD1: 1.0
      GAD2: 1.0
  action: Amacrine_Cell
  source: peng2019
  notes: GAD1+GAD2 expression is characteristic of amacrine cells (GABAergic)
- priority: 2
  condition:
    markers_present:
      VSX1: 1.0
      PRKCA: 1.0
  action: Bipolar_Cell
  source: peng2019
  notes: VSX1+PRKCA co-expression defines bipolar cells
conflicts:
- type_a:
    cell_type: Rod_Photoreceptor
    marker: NR2E3
  type_b:
    cell_type: Cone_Photoreceptor
    marker: NR2E3
  notes: NR2E3 is rod-specific in this study but some sources report low expression
    in developing cones
  source:
    a: peng2019
    b: yan2020
- type_a:
    cell_type: Amacrine_Cell
    marker: CALB1
  type_b:
    cell_type: Horizontal_Cell
    marker: CALB1
  notes: CALB1 expressed in both amacrine and horizontal cells; not specific alone
  source:
    a: peng2019
    b: peng2020
