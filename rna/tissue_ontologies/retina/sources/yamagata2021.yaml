expert_rules:
- priority: 1
  condition:
    markers_present:
      RHO: 1.0
      PDE6B: 0.5
  action: Rod_Photoreceptor
  source: yamagata2021
  notes: RHO+PDE6B canonical rod signature; conserved across chick and mammals

- priority: 2
  condition:
    markers_present:
      ARR3: 1.0
      GNAT2: 0.5
      OPN1LW: 0.5
  action: Cone_Photoreceptor
  source: yamagata2021
  notes: Chick has 4 single cone types (red/green/blue/violet opsins) + double cones

- priority: 3
  condition:
    markers_present:
      RLBP1: 1.0
      GLUL: 1.0
  action: Muller_Glia
  source: yamagata2021
  notes: Canonical Müller glia signature conserved across vertebrates

- priority: 4
  condition:
    markers_present:
      ONECUT1: 1.0
      LHX1: 0.5
  action: Horizontal_Cell
  source: yamagata2021
  notes: ONECUT1+LHX1 canonical HC signature

- priority: 5
  condition:
    markers_present:
      VSX2: 1.0
      OTX2: 0.5
  action: Bipolar_Cell
  source: yamagata2021
  notes: VSX2/Chx10 + OTX2 mark bipolar cells; 22 types

- priority: 6
  condition:
    markers_present:
      TFAP2A: 1.0
  action: Amacrine_Cell
  source: yamagata2021
  notes: TFAP2A is pan-AC marker in chick retina; 59 types

- priority: 7
  condition:
    markers_present:
      RBPMS: 1.0
      THY1: 0.5
  action: RGC
  source: yamagata2021
  notes: RBPMS+THY1 pan-RGC signature conserved across chick and mammals

- priority: 10
  condition:
    markers_present:
      CALB1: 1.0
      OPN1LW: 1.0
      RHO: 0.0
  action: Chicken_Double_Cone
  source: yamagata2021
  notes: CALB1+OPN1LW marks double cones; uniquely non-mammalian. RHO must be negative.

