markers:
  RPE:
    add:
    - LINC00276
    - TRPM3
    - OTX2-AS1
    - MYRIP
    - GPM6A
    - CACNB2
    - PLD5
    - ATP10B
    - OPCML
    - BEST1
    - RGR
    - STRIP2
    - RPE65
    - CACNA2D3
    - DAAM1
    refine:
      TRPM3:
        note: Transient receptor potential channel; highest fraction expressed in RPE (0.997). Novel RPE marker from Wang
          2026.
        threshold: mean_log2FC > 3.2
        pmid: '41528844'
      MYRIP:
        note: Myosin VIIA and Rab interacting protein; involved in melanosome transport in RPE.
        threshold: mean_log2FC > 2.9
        pmid: '41528844'
      BEST1:
        note: Bestrophin-1; canonical RPE marker; mutations cause Best vitelliform macular dystrophy. Confirms existing KB
          consensus (Menon 2019, Hu 2019).
        threshold: mean_log2FC > 2.6
        pmid: '41528844'
      RGR:
        note: RPE-retinal G protein-coupled receptor; visual cycle component enriched in RPE. Confirms existing KB consensus
          (Menon 2019).
        threshold: mean_log2FC > 2.6
        pmid: '41528844'
      RPE65:
        note: Visual cycle isomerase; essential for retinoid recycling; RPE-specific. Confirms existing KB consensus (Menon
          2019).
        threshold: mean_log2FC > 2.3
        pmid: '41528844'
    negative_markers: []
    species: []
    synonyms: []
    audit:
      expression_validated: []
      supplement_verified:
