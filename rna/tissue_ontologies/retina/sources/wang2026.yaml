source_meta:
  id: wang2026
  short_name: Wang 2026 Cell Rep
  pmid: '41528844'
  journal: Cell Reports
  year: 2026
  species:
  - Homo sapiens
  tissue: RPE + choroid
  regions:
  - posterior pole
