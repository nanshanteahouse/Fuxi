expert_rules:
- priority: 10
  condition:
    markers_present:
      BEST1: 1.0
      RPE65: 1.0
      RGR: 0.5
  action: RPE
  source: wang2026
  notes: BEST1+RPE65 is the canonical RPE signature; RPE65 is the visual cycle isomerase specific to RPE
- priority: 9
  condition:
    markers_present:
      VWF: 1.0
      PECAM1: 1.0
      FLT1: 0.5
  action: Vascular_Endothelial
  source: wang2026
  notes: VWF+PECAM1 canonical vascular endothelial signature; FLT1 is the top-ranked marker by log2FC in this study
- priority: 8
  condition:
    markers_present:
      F13A1: 1.0
      CD163: 0.5
  action: Macrophage
  source: wang2026
  notes: F13A1+CD163 is a choroidal macrophage signature distinct from retinal microglia (C1QA/B+)
- priority: 7
  condition:
    markers_present:
      TYR: 1.0
      PMEL: 0.5
  action: Melanocyte
  source: wang2026
  notes: TYR+PMEL canonical melanocyte signature; choroidal melanocyte marker
conflicts: []
