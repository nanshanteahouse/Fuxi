          (Menon 2019).
        threshold: mean_log2FC > 3.2
        pmid: '41528844'
      VWF:
        note: von Willebrand factor; canonical endothelial marker. Confirms existing KB consensus (Menon 2019).
        threshold: mean_log2FC > 2.7
        pmid: '41528844'
    negative_markers: []
    species: []
