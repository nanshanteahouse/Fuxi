expert_rules:
- priority: 1
  condition:
    markers_present:
      RPE65: 1.0
      BEST1: 1.0
  action: RPE
  source: hu2019
  notes: RPE65+BEST1 co-expression defines fetal RPE cells
- priority: 1
  condition:
    markers_present:
      VSX2: 1.0
      SOX2: 1.0
  action: RPC
  source: hu2019
  notes: VSX2+SOX2 co-expression defines fetal retinal progenitor cells
- priority: 1
  condition:
    markers_present:
      CRX: 1.0
      RCVRN: 1.0
  action: Photoreceptor_Precursor
  source: hu2019
  notes: CRX+RCVRN expression defines photoreceptor precursors in fetal retina
- priority: 1
  condition:
    markers_present:
      COL1A1: 1.0
      DCN: 1.0
  action: Fibroblast
  source: hu2019
  notes: COL1A1+DCN co-expression defines fetal fibroblasts
- priority: 1
  condition:
    markers_present:
      POU4F2: 1.0
      NEFM: 1.0
  action: Retinal_Ganglion_Cell
  source: hu2019
  notes: POU4F2+NEFM co-expression defines fetal RGCs
- priority: 1
  condition:
    markers_present:
      ONECUT1: 1.0
      PROX1: 1.0
  action: Horizontal_Cell
  source: hu2019
  notes: ONECUT1+PROX1 co-expression defines fetal horizontal cells
- priority: 2
  condition:
