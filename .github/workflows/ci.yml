name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # Lint
  # ════════════════════════════════════════════════════════════════════════
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: uv tool install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format (check)
        run: ruff format --check .

  # ════════════════════════════════════════════════════════════════════════
  # Type check
  # ════════════════════════════════════════════════════════════════════════
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "requirements/*.txt"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev cmake
      - name: Install deps
        run: uv pip install -e ".[all]"
      - name: Pyright
        run: uv pip install pyright==1.1.411 && uv run pyright --level error

  # ════════════════════════════════════════════════════════════════════════
  # Smoke test (fast gate)
  # ════════════════════════════════════════════════════════════════════════
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "requirements/*.txt"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev cmake
      - name: Install deps
        run: uv pip install -e ".[all,dev]"
      - name: Smoke test
        run: uv run pytest tests/ -m smoke -v --tb=short

  # ════════════════════════════════════════════════════════════════════════
  # Unit tests (split by modality for parallelism)
  # ════════════════════════════════════════════════════════════════════════
  test-core:
    needs: [lint, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "requirements/*.txt"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev cmake
      - name: Install deps
        run: uv pip install -e ".[all,dev]"
      - name: Test core
        run: uv run pytest tests/test_core/ -v --tb=short --cov=core --cov-report=xml --cov-report=term

  test-rna:
    needs: [lint, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "requirements/*.txt"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev cmake
      - name: Install deps
        run: uv pip install -e ".[all,dev]"
      - name: Test RNA
        run: uv run pytest tests/test_rna/ -v --tb=short --cov=rna --cov-report=xml --cov-report=term

  # ════════════════════════════════════════════════════════════════════════
  # Coverage report (aggregate)
  # ════════════════════════════════════════════════════════════════════════
  coverage:
    needs: [test-core, test-rna]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Coverage summary
        run: echo "Coverage aggregated from test-core and test-rna jobs."
