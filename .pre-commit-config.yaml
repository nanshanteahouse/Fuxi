# Fuxi (伏羲) — Pre-commit hooks
# Install: pre-commit install            # run on every commit
#           pre-commit install --hook-type pre-push  # smoke test on push
# Manual:   pre-commit run --all-files    # check everything

repos:
  # ── General file hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # ── Python linting & formatting (use .venv ruff) ──────────────────
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
        stages: [pre-commit]

  # ── Type checking (local, slower — pre-push only) ─────────────────────
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

  # ── Smoke test (pre-push only — fast gate before CI) ──────────────────
  - repo: local
    hooks:
      - id: smoke-test
        name: smoke test
        entry: .venv/bin/python -m pytest tests/ -m smoke -x --tb=short
        language: system
        pass_filenames: false
        stages: [pre-push]
