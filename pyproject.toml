[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
minversion = "7.0"
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = [
    "error",
    'ignore::DeprecationWarning:pkg_resources.*',
]
[tool.ruff]
target-version = "py312"
line-length = 99
