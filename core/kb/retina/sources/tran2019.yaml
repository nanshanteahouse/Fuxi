expert_rules:
- priority: 1
  condition:
    markers_present:
      RBPMS: 1.0
    corroborators:
    - NEFL
    - SNCG
    - SLC17A6
  action: RGC
  source: tran2019
  notes: RBPMS is the gold-standard pan-RGC marker (100% of RGCs, including ipRGCs)
- priority: 2
  condition:
    markers_present:
      OPN4: 1.0
  action: RGC_ipRGC
  source: tran2019
  notes: OPN4 (melanopsin) definitively identifies ipRGCs
- priority: 3
  condition:
    markers_present:
      CARTPT: 1.0
  action: RGC_ooDSGC
  source: tran2019
  notes: CART (CARTPT) labels all ON-OFF direction-selective RGCs
- priority: 4
  condition:
    markers_present:
      SPP1: 1.0
    corroborators:
    - RBPMS
    - POU4F1
    - NEFH
    - SMI-32
  action: RGC_Alpha
  source: tran2019
  notes: SPP1 (osteopontin) labels αRGCs (also M2 ipRGCs)
