source_meta:
  id: tran2019
  short_name: Tran 2019 Neuron
  pmid: '31784286'
  journal: Neuron
  year: 2019
  species:
  - Mus musculus
  tissue: retina
  regions:
  - whole retina
  n_cells: 35699
  n_subtypes: 46
  n_groups: 7
  class: Mammalia
  order: Rodentia
markers:
  RGC:
    confirm:
    - RBPMS
    add:
    - SLC17A6
    - POU4F1
    - POU4F2
    - POU4F3
    - THY1
    - NEFL
    - NEFM
    - GAP43
    - DCX
    refine:
      RBPMS:
        note: Gold-standard pan-RGC marker. Labels 100% of RGCs including non-image-forming
          ipRGCs. Superior to POU4F2 which only labels ~70%.
    negative_markers:
    - RLBP1
    - GLUL
    species: []
    synonyms: []
    audit:
      expression_validated: []
      supplement_verified:
      - RBPMS:domain_knowledge
      - SLC17A6:domain_knowledge
      - POU4F1:domain_knowledge
      - POU4F2:domain_knowledge
      cross_species_validated: false
      last_audited: '2026-07-15'
      flagged: true
      notes: "POU4F2 is a pan-RGC TF (~70% coverage, misses ipRGCs) — demoted from\
        \ confirm to add tier. RBPMS is the true pan-RGC marker covering all subtypes."
  RGC_Alpha:
    confirm:
    - SPP1
    add:
    - NEFH
    - KCNG4
    - NGEF
    - FES
    - TPBG
    - KIT
    - IL1RAPL2
    refine:
      SPP1:
        note: Osteopontin; pan-αRGC marker but also labels M2 ipRGCs. Combine with
          NEFH/SMI-32 for specificity.
    negative_markers: []
    species: []
    synonyms: []
    audit:
      expression_validated: []
      supplement_verified: [Table_S2_RGC_subtype_markers]
      cross_species_validated: false
      last_audited: '2026-07-16'
      flagged: false
      notes: "The Table S2 (单独提取的Table S2.xlsx) contains 56 rows of RGC subtype markers. Cross-reference against: Cluster Specific Markers, Subclass Markers, Additional Known Markers columns."
  RGC_ipRGC:
    confirm:
    - OPN4
    add:
    - EOMES
    - ADCYAP1
    - NMB
    - SERPINE2
    - CDHR1
    - TBX20
    - TAGLN2
    - PRKCQ
    - TAC1
    refine:
      OPN4:
        note: Melanopsin; definitive ipRGC marker. EOMES (Tbr2) is nuclear marker
          for M4 identification.
    negative_markers: []
    species: []
    synonyms: []
    audit:
      expression_validated: []
      supplement_verified: [Table_S2_RGC_subtype_markers]
      cross_species_validated: false
