      flagged: false
      notes: "The Table S2 (单独提取的Table S2.xlsx) contains 56 rows of RGC subtype markers. Cross-reference against: Cluster Specific Markers, Subclass Markers, Additional Known Markers columns."
  RGC_ooDSGC:
    confirm:
    - CARTPT
    add:
    - NEUROD2
    - MMP17
    - COL25A1
    - GPR88
    - FAM19A4
    - VIT
    refine:
      CARTPT:
        note: CART peptide; labels all and only ooDSGCs. Combine with MMP17 (N-preferring)
          or COL25A1 (D/V-preferring) for direction specificity.
