# Cell-cycle gene lists — Macaca mulatta / Macaca fascicularis
# Cell-cycle machinery is highly conserved across primates. Macaque gene
# symbols follow the same all-caps HGNC convention as human.
#
# The lists below are the Tirosh et al. 2016 human gene set, which is
# directly applicable to macaque due to near-perfect orthology of core
# cell-cycle genes. Use for sc.tl.score_genes_cell_cycle with macaque data.
#
# Reference:
#   Tirosh et al., 2016, Science, DOI: 10.1126/science.aad0501

