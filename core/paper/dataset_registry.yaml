# ──────────────────────────────────────────────────────────────────────
#  Dataset Registry
#  ──────────────────────────────────────────────────────────────────────
#  Each entry links a dataset to its pipeline output h5ad and metadata.
#
#  To add a new dataset, add a new entry under `datasets:`.
#  Paths are relative to the project root (or absolute).
# ──────────────────────────────────────────────────────────────────────

datasets:
  - label: "Wohl2026_PCW8"
    paper: "Wohlschlegel 2026"
    h5ad: "projects/rna/GSE310245/results/h5ad_pcw8_multiome/05_annotated.h5ad"
    grn_table: "projects/rna/GSE310245/results/tables_pcw8_multiome/11_grn/tf_activity_per_cell_type.csv"
    cell_type_col: "cell_type"
    condition_label: "PCW8 fetal retina (Peripheral+Central)"
    split_col: "sample"
    condition_map:
      GSM9292434_SCR205: "PCW8_Peripheral"   # nasal peripheral
      GSM9292436_SCR206: "PCW8_Central"      # temporal central
    metadata:
      species: "human"
      stage: "PCW8"
      region: "macula+periphery"

